# fly.toml - Fly.io configuration for KMSF Backend
app = 'kmsf-backend'
primary_region = 'lhr'  # London - closest to UK users

[build]

[http_service]
  internal_port = 5000
  force_https   = true
  auto_stop_machines  = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  size   = 'shared-cpu-1x'
  memory = '256mb'
